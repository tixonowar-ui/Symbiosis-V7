name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Windows is the target platform (ADR 0001), so checks run where the code
    # will actually live. It also catches line-ending regressions that a Linux
    # runner would silently pass.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Install scripts are decided per package via `allowScripts` in
      # package.json, not switched off globally. A dependency that nobody ruled
      # on is only a warning in npm's output, which is easy to miss — so it
      # fails here instead. See ADR 0002.
      - name: Every install script is ruled on
        shell: bash
        run: |
          pending=$(npm approve-scripts --allow-scripts-pending --json)
          count=$(node -e "process.stdout.write(String((JSON.parse(process.argv[1]).allowScripts ?? []).length))" "$pending")
          if [ "$count" != "0" ]; then
            echo "::error::$count dependency package(s) have install scripts with no decision in package.json > allowScripts. Decide explicitly: false to deny, true to allow, and say why in the PR."
            echo "$pending"
            exit 1
          fi
          echo "all install scripts are ruled on"

      # The runner ships Visual Studio Build Tools and Python, so a native
      # rebuild would succeed here and hide the fact that it fails on a
      # developer machine. Fail if better-sqlite3 was compiled instead of
      # using its bundled prebuild — see ADR 0002.
      - name: No native build happened
        shell: bash
        run: |
          if [ -d node_modules/better-sqlite3/build ]; then
            echo "::error::better-sqlite3 was compiled from source. The bundled prebuild should have been used; check allowScripts in package.json."
            exit 1
          fi
          node -e "const D=require('better-sqlite3');const db=new D(':memory:');db.exec('create table t(a int)');db.close();console.log('better-sqlite3 loads from prebuild')"

      # Artifacts are read-only sources of truth. If they drifted, nothing
      # downstream can be trusted, so this runs before anything else.
      - name: Checksums
        run: npm run checksums:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # generated/media is not committed (ADR 0016), and the media tests read
      # what the pipeline produced — so the import has to run before tests.
      # Compare every generated path and byte across two imports, including
      # ignored media and SQLite output (ADR 0015, 0016 and 0019).
      - name: Import and verify reproducibility
        run: npm run import:verify

      # Stable output can still differ from the version committed in the PR.
      # Keep this independent gate as well as the full byte comparison above.
      - name: Committed pipeline output is current
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- generated/)" ]; then
            echo "::error::generated/ changed after running the import."
            echo "Either commit the rebuilt output, or the pipeline is not deterministic."
            git --no-pager diff --stat -- generated/
            git status --porcelain -- generated/
            exit 1
          fi
          echo "generated/ matches the committed output"

      - name: Traceability
        run: npm run traceability:verify

      - name: Tests
        run: npm test

      - name: Cross-registry validation
        run: npm run validate

      - name: E2E
        id: e2e
        # Builds the production client; fixtures start isolated real hosts.
        # The tests use Chrome supplied by the Windows runner.
        run: npm run test:e2e

      # A successful retry leaves the step green but must keep the original
      # failure's trace and screenshot available for investigation.
      - name: Upload E2E diagnostics
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_attempt }}
          path: |
            reports/playwright-report/
            reports/e2e-artifacts/
          retention-days: 14

  markers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unfinished-work markers carry a milestone or a reason
        shell: bash
        run: |
          bad=$(grep -rnE '\b(TODO|STUB|BLOCKED|FIXME|XXX|HACK)\b' \
                  --include='*.ts' --include='*.tsx' --include='*.js' \
                  src tools tests 2>/dev/null \
                | grep -vE '\b(TODO|STUB|BLOCKED)\([^)]+\)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Markers must be TODO(<milestone>), STUB(<milestone>) or BLOCKED(<reason>). See AGENTS.md section 9."
            echo "$bad"
            exit 1
          fi
          echo "all markers are qualified"
