name: PR size

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One task = one minimal diff (AGENTS.md section 6). This guards against a
# "rebuild the whole app" PR slipping past review by being too large to read.
#
# Code, tests and documentation are counted separately on purpose. A 2000-line
# documentation PR is ordinary; a 2000-line code PR is a rewrite. One shared
# limit would either block honest documentation work or let a rewrite through,
# depending on where it was set. The handoff PR that introduced this workflow
# was 1798 lines of documentation and 311 of code — exactly the shape a single
# limit misjudges.
#
# Tests earned their own budget for the same reason, measured rather than
# guessed. The first three substantial tasks came in at:
#
#   #13 traceability   851 lines, 193 of them tests
#   #17 Q&A import     879 lines, 217 of them tests
#   #20 persistence    897 lines, 331 of them tests
#
# Three consecutive PRs within 3% of a 900-line ceiling meant the limit had
# stopped catching rewrites and started taxing ordinary work — and taxing it
# hardest where coverage was best, since a test line cost exactly what an
# implementation line did. That is a direct incentive to write fewer tests to
# fit, which inverts the point of the guard. Implementation alone measured
# 566–662 lines across those three, so the limits below leave real headroom
# while still refusing a module rewrite.
#
# A 2026-08-17 follow-up recorded in #90 measured a 45-commit main sample with
# the same buckets. The largest ordinary changes again clustered near both ceilings:
#
#   PR    code added/deleted    tests added/deleted
#   #27              896/2                  700/0
#   #43              892/0                  690/0
#   #37              856/7                  571/0
#   #38              717/0                  392/0
#   #63             660/58                  128/5
#   #87            603/166                 549/59
#
# The split exposed the metric mismatch: additions measure review growth, while
# deletions measure replacement. #30 was only +257/-204 code, and the pending
# #62 slice was +1044/-203 code — 1247 lines under the old aggregate metric.
# Charging both directions to one budget made additive work spend replacement
# headroom and replacement work spend additive headroom.
#
# That round set 1500 code additions (20% above #62's old 1247-line
# calibration point) with 400 deletions, and 1200 test additions with 200
# deletions. Those four numbers were superseded on 2026-08-18; the reasoning
# above is kept because the next recalibration rests on it.
#
# Third round, issue #103, measured the 14 most recent first-parent merges with
# the buckets below:
#
#   PR    code added/deleted    tests added/deleted
#   #102          1488/111               1195/9
#   #92           1112/203                812/47
#   #100           731/99                 810/9
#   #87           603/166                 549/59
#   #94            276/60                 230/4
#   #81            193/1                  313/4
#
# Two of six pressed against the addition ceilings — #102 finished with 12
# lines of code headroom and 5 of test headroom — while deletions never came
# near theirs: 203 observed against a limit of 400. The guard was therefore
# rationing the quantity that says nothing about rewriting, and barely
# exercising the one that does. Worse, the pressure was paid in agent effort:
# work was split at boundaries the task did not have, purely to fit.
#
# That round set 4000 code and 3000 test additions, against observed maxima of
# 1488 and 1195, and doubled deletions to 800 and 400 so an authorised
# generalisation like #100's navigation switch (-99) or #92's (-203) stopped
# being punished. Code files went to 40 against an observed 20. Those numbers
# were superseded on 2026-08-20; the reasoning is kept because the fourth round
# rests on it.
#
# Fourth round, issue #123, measured the 14 most recent first-parent merges plus
# the pending #121:
#
#   PR    code added/deleted    tests added/deleted
#   #119           3866/105              2447/59
#   #121           3679/614              2383/110
#   #116           2884/135              2181/40
#   #97            1771/131              1906/15
#   #102           1454/116              1195/44
#   #106           1240/466               691/87
#
# Code additions ran at 92-97% of their ceiling twice in a row while review
# found nothing the ceiling would have caught. Two things changed since the
# third round. First, deletions finally exercised their budget: 614 of 800, and
# they came from generalisation the task specification asked for in writing,
# not from rewriting — the guard started pressing on the change the project
# wants. Second, and decisive: the author of #121 reported weighing whether
# review findings would still fit. A size guard must not be in the room when
# someone decides whether a correctness fix ships.
#
# The ceilings below therefore go to 5500 code additions against an observed
# 3866, and 1500 code deletions against an observed 614. The multiplier is
# smaller than the third round's 2.7x on purpose: the binding constraint is no
# longer how much can be written but how much can be read closely in one
# review, and ~6000 hand-written lines is the measured edge of that.
#
# MAX_TEST_ADDED is removed rather than raised. Tests earned a separate budget
# so they would stop crowding out code, and the separation alone achieves that.
# A remaining ceiling only makes an author weigh whether the test for a fix
# fits, which is the exact cost the split was meant to remove; "too many tests"
# has never been a reason to fail a PR here. Test deletions keep their limit,
# because deleting a test is how a red build turns green — that is the one
# signal this bucket exists to catch.
#
# generated/ is excluded entirely: a re-imported artifact legitimately rewrites
# megabytes, and that is pipeline output, not hand-written work.
#
# artifacts/ gets its own aggregate budget rather than counting as code. A
# delivered artifact is authored outside the repository and reaches it only
# with the owner's explicit sanction, so its diff size measures nothing about
# review risk — while its checksum manifest quietly charged 39 lines to #102's
# code budget. The 2000-line ceiling stays only as a tripwire: it still fails a
# PR that accidentally re-serialises the 275k-line atlas, which is the one
# artifact accident worth catching automatically.
jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Measure hand-written change
        shell: bash
        env:
          MAX_CODE_ADDED: 5500
          MAX_CODE_DELETED: 1500
          MAX_CODE_FILES: 40
          MAX_TEST_DELETED: 400
          MAX_DOC_LINES: 3000
          MAX_ARTIFACT_LINES: 2000
          MAX_TOTAL_FILES: 60
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "$base" "$head"

          stat=$(git diff --numstat "$base" "$head" -- . \
                 ':(exclude)generated/**' ':(exclude)package-lock.json')

          if [ -z "$stat" ]; then
            echo "no hand-written changes"
            exit 0
          fi

          # Classification lives in one awk pass so a path is bucketed exactly
          # once. Binary files report "-" instead of a count; awk reads that as
          # zero, which is what we want — a binary blob has no reviewable lines.
          #
          # artifacts/ is tested first on purpose: the delivered atlas ships as
          # both .json and .md, and neither is project documentation. Ordering
          # this branch after the .md test would file half a delivery under
          # docs and the other half under code.
          set -- $(echo "$stat" | awk -F'\t' '
            {
              added = $1 + 0
              deleted = $2 + 0
              total_files++
              if ($3 ~ /^artifacts\//) {
                artifact_lines += added + deleted; next
              }
              if ($3 ~ /\.(md|txt)$/) {
                doc_lines += added + deleted; next
              }
              if ($3 ~ /(^|\/)tests\// || $3 ~ /\.(test|spec)\.tsx?$/) {
                test_added += added; test_deleted += deleted
                test_files++; next
              }
              code_added += added; code_deleted += deleted
              code_files++
            }
            END {
              printf "%d %d %d %d %d %d %d %d %d\n",
                code_files+0, code_added+0, code_deleted+0,
                test_files+0, test_added+0, test_deleted+0,
                doc_lines+0, artifact_lines+0, total_files+0
            }')
          code_files=$1; code_added=$2; code_deleted=$3
          test_files=$4; test_added=$5; test_deleted=$6
          doc_lines=$7; artifact_lines=$8; total_files=$9

          echo "code:  $code_files files (limit $MAX_CODE_FILES), +$code_added (limit $MAX_CODE_ADDED), -$code_deleted (limit $MAX_CODE_DELETED)"
          echo "tests: $test_files files, +$test_added (no limit), -$test_deleted (limit $MAX_TEST_DELETED)"
          echo "docs:  $doc_lines lines (limit $MAX_DOC_LINES)"
          echo "artifacts: $artifact_lines lines (limit $MAX_ARTIFACT_LINES)"
          echo "total: $total_files files (limit $MAX_TOTAL_FILES)"
          echo
          echo "$stat" | sort -k3

          over=""
          [ "$code_files" -gt "$MAX_CODE_FILES" ] && over="$over code-files"
          [ "$code_added" -gt "$MAX_CODE_ADDED" ] && over="$over code-added"
          [ "$code_deleted" -gt "$MAX_CODE_DELETED" ] && over="$over code-deleted"
          [ "$test_deleted" -gt "$MAX_TEST_DELETED" ] && over="$over test-deleted"
          [ "$doc_lines" -gt "$MAX_DOC_LINES" ] && over="$over doc-lines"
          [ "$artifact_lines" -gt "$MAX_ARTIFACT_LINES" ] && over="$over artifact-lines"
          [ "$total_files" -gt "$MAX_TOTAL_FILES" ] && over="$over total-files"

          if [ -n "$over" ]; then
            echo "::error::PR exceeds the size limit ($over). Split it, or explain in the PR why it cannot be split and ask the owner to override."
            exit 1
          fi
          echo "within limits"
